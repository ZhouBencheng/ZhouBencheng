<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="lanternBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8302a"/>
      <stop offset="50%" style="stop-color:#d4380d"/>
      <stop offset="100%" style="stop-color:#a8071a"/>
    </linearGradient>
    <linearGradient id="lanternBody2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8302a"/>
      <stop offset="50%" style="stop-color:#d4380d"/>
      <stop offset="100%" style="stop-color:#a8071a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes swingLeft {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes swingRight {
      0%, 100% { transform: rotate(3deg); }
      50% { transform: rotate(-3deg); }
    }
    @keyframes tassleSwing {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
    .lantern-left {
      animation: swingLeft 3s ease-in-out infinite;
      transform-origin: 100px 0px;
    }
    .lantern-right {
      animation: swingRight 3s ease-in-out infinite;
      transform-origin: 300px 0px;
    }
    .glow-effect {
      animation: glowPulse 2s ease-in-out infinite;
    }
    .sparkle { animation: sparkle 2s ease-in-out infinite; }
    .sparkle-d1 { animation-delay: 0.3s; }
    .sparkle-d2 { animation-delay: 0.7s; }
    .sparkle-d3 { animation-delay: 1.1s; }
    .sparkle-d4 { animation-delay: 1.5s; }
    .sparkle-d5 { animation-delay: 0.5s; }
    .sparkle-d6 { animation-delay: 1.8s; }
  </style>

  <!-- Left Lantern -->
  <g class="lantern-left">
    <!-- Glow -->
    <ellipse cx="100" cy="65" rx="35" ry="35" fill="url(#lanternGlow)" class="glow-effect"/>
    <!-- String -->
    <line x1="100" y1="0" x2="100" y2="25" stroke="#8B6914" stroke-width="1.5"/>
    <!-- Top cap -->
    <rect x="88" y="23" width="24" height="6" rx="2" fill="#DAA520" stroke="#B8860B" stroke-width="0.5"/>
    <!-- Body -->
    <ellipse cx="100" cy="55" rx="22" ry="26" fill="url(#lanternBody)" filter="url(#glow)"/>
    <!-- Ribs -->
    <ellipse cx="100" cy="55" rx="22" ry="26" fill="none" stroke="#ff8a65" stroke-width="0.3" opacity="0.5"/>
    <line x1="100" y1="29" x2="100" y2="81" stroke="#ff8a65" stroke-width="0.3" opacity="0.4"/>
    <ellipse cx="100" cy="42" rx="20" ry="3" fill="none" stroke="#ff8a65" stroke-width="0.3" opacity="0.3"/>
    <ellipse cx="100" cy="68" rx="20" ry="3" fill="none" stroke="#ff8a65" stroke-width="0.3" opacity="0.3"/>
    <!-- Fu character -->
    <text x="100" y="61" text-anchor="middle" fill="#FFD700" font-size="22" font-weight="bold" font-family="serif" filter="url(#glow)">福</text>
    <!-- Bottom cap -->
    <rect x="88" y="79" width="24" height="6" rx="2" fill="#DAA520" stroke="#B8860B" stroke-width="0.5"/>
    <!-- Tassle -->
    <line x1="100" y1="85" x2="100" y2="100" stroke="#DAA520" stroke-width="1.2"/>
    <ellipse cx="100" cy="102" rx="4" ry="5" fill="#DAA520"/>
    <line x1="96" y1="102" x2="94" y2="115" stroke="#DAA520" stroke-width="0.8"/>
    <line x1="100" y1="107" x2="100" y2="118" stroke="#DAA520" stroke-width="0.8"/>
    <line x1="104" y1="102" x2="106" y2="115" stroke="#DAA520" stroke-width="0.8"/>
  </g>

  <!-- Center Text -->
  <text x="200" y="50" text-anchor="middle" fill="#d4380d" font-size="16" font-weight="bold" font-family="'Georgia', serif" opacity="0.9">新春快乐</text>
  <text x="200" y="72" text-anchor="middle" fill="#B8860B" font-size="11" font-family="'Georgia', serif" opacity="0.8">Happy Chinese New Year</text>
  <text x="200" y="92" text-anchor="middle" fill="#d4380d" font-size="13" font-family="'Georgia', serif" opacity="0.7">🐴 2026 马年大吉 🐴</text>

  <!-- Right Lantern -->
  <g class="lantern-right">
    <!-- Glow -->
    <ellipse cx="300" cy="65" rx="35" ry="35" fill="url(#lanternGlow)" class="glow-effect"/>
    <!-- String -->
    <line x1="300" y1="0" x2="300" y2="25" stroke="#8B6914" stroke-width="1.5"/>
    <!-- Top cap -->
    <rect x="288" y="23" width="24" height="6" rx="2" fill="#DAA520" stroke="#B8860B" stroke-width="0.5"/>
    <!-- Body -->
    <ellipse cx="300" cy="55" rx="22" ry="26" fill="url(#lanternBody2)" filter="url(#glow)"/>
    <!-- Ribs -->
    <ellipse cx="300" cy="55" rx="22" ry="26" fill="none" stroke="#ff8a65" stroke-width="0.3" opacity="0.5"/>
    <line x1="300" y1="29" x2="300" y2="81" stroke="#ff8a65" stroke-width="0.3" opacity="0.4"/>
    <ellipse cx="300" cy="42" rx="20" ry="3" fill="none" stroke="#ff8a65" stroke-width="0.3" opacity="0.3"/>
    <ellipse cx="300" cy="68" rx="20" ry="3" fill="none" stroke="#ff8a65" stroke-width="0.3" opacity="0.3"/>
    <!-- Fu character -->
    <text x="300" y="61" text-anchor="middle" fill="#FFD700" font-size="22" font-weight="bold" font-family="serif" filter="url(#glow)">福</text>
    <!-- Bottom cap -->
    <rect x="288" y="79" width="24" height="6" rx="2" fill="#DAA520" stroke="#B8860B" stroke-width="0.5"/>
    <!-- Tassle -->
    <line x1="300" y1="85" x2="300" y2="100" stroke="#DAA520" stroke-width="1.2"/>
    <ellipse cx="300" cy="102" rx="4" ry="5" fill="#DAA520"/>
    <line x1="296" y1="102" x2="294" y2="115" stroke="#DAA520" stroke-width="0.8"/>
    <line x1="300" y1="107" x2="300" y2="118" stroke="#DAA520" stroke-width="0.8"/>
    <line x1="304" y1="102" x2="306" y2="115" stroke="#DAA520" stroke-width="0.8"/>
  </g>

  <!-- Sparkles -->
  <circle cx="55" cy="20" r="1.5" fill="#FFD700" class="sparkle sparkle-d1"/>
  <circle cx="150" cy="15" r="1" fill="#ff6b35" class="sparkle sparkle-d2"/>
  <circle cx="250" cy="12" r="1" fill="#ff6b35" class="sparkle sparkle-d3"/>
  <circle cx="345" cy="20" r="1.5" fill="#FFD700" class="sparkle sparkle-d4"/>
  <circle cx="170" cy="100" r="1" fill="#FFD700" class="sparkle sparkle-d5"/>
  <circle cx="230" cy="105" r="1" fill="#FFD700" class="sparkle sparkle-d6"/>
</svg>
